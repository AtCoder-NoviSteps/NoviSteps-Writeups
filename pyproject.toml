[project]
name = "contest-discussions"
version = "0.1.0"
description = "Automatically create GitHub Discussions for each ABC problem after the contest ends."
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "requests>=2.32",
    "selectolax>=0.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "responses>=0.25",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
